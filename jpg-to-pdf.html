<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JPG to PDF Converter Online — Free | FileFlip</title>
    <meta name="description"
        content="Convert JPG, PNG and WebP images into a PDF online for free. Combine multiple images into one PDF directly in your browser.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">F</span>FileFlip</a>
            <nav><a href="tools.html">Tools</a><a href="about.html">About</a></nav><a class="nav-cta"
                href="tools.html">All tools →</a>
        </div>
    </header>
    <main class="tool-page container">
        <div class="tool-title">
            <div class="eyebrow">IMAGE CONVERTER</div>
            <h1>JPG to <span>PDF</span></h1>
            <p>Turn multiple JPG, PNG or WebP images into one PDF document.</p>
        </div>
        <div class="converter">
            <div class="dropzone" id="dropzone">
                <div class="drop-inner">
                    <div class="drop-icon">IMG</div>
                    <h2>Drop your images here</h2>
                    <p>Choose one or multiple images</p><button class="button primary" id="chooseBtn">Choose
                        images</button><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp"
                        multiple hidden>
                </div>
            </div>
            <div id="preview" class="results"></div><button class="button primary" id="createBtn"
                style="width:100%;margin-top:15px" hidden>Create PDF</button>
            <div class="status" id="status"></div>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer-bottom">© 2026 FileFlip · <a href="privacy.html">Privacy</a> · <a
                href="terms.html">Terms</a></div>
    </footer>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="js/jpg-to-pdf.js"></script>
</body>

</html>
